name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market_dev
          POSTGRES_DB: market_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market -d market_booking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://market:market_dev@localhost:5432/market_booking
      TEST_DATABASE_URL: postgresql://market:market_dev@localhost:5432/market_booking_test
      REDIS_URL: redis://localhost:6379
      # MinIO เฉพาะ CI (ค่าทิ้งได้ ไม่ใช่ secret จริง)
      MINIO_ENDPOINT: localhost
      MINIO_PORT: '9000'
      MINIO_ACCESS_KEY: ci_minio
      MINIO_SECRET_KEY: ci_minio_secret
      MINIO_IMAGE: pgsty/minio:RELEASE.2026-08-04T00-00-00Z

    steps:
      - uses: actions/checkout@v7

      # services ของ GitHub Actions กำหนด command ไม่ได้ (MinIO ต้องรัน `server /data`) จึงเปิดเอง
      # เริ่มก่อน install เพื่อให้ boot เสร็จระหว่างรอ
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$MINIO_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            "$MINIO_IMAGE" server /data

      # อ่านเวอร์ชันจาก "packageManager" ใน package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ช่องโหว่ระดับ high/critical ใน dependency ที่ขึ้น production = ไม่ผ่าน (docs/security-review.md)
      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit test
        run: pnpm test

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1

      # globalSetup สร้าง DB test, รัน prisma migrate deploy, ล้าง Redis db 15 และสร้าง bucket ของ test ให้
      - name: Integration test (PostgreSQL + Redis + MinIO)
        run: pnpm test:int

      - name: Migrations in sync with schema.prisma
        run: pnpm prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Seed runs on a migrated database
        run: pnpm db:deploy && pnpm db:seed
        env:
          SEED_ADMIN_PASSWORD: ci-only-password

      - name: Build
        run: pnpm build

      - name: Install Playwright (Chromium)
        run: pnpm --filter @market-booking/e2e exec playwright install --with-deps chromium

      # เปิด api (port 3100) + web (port 5183) ของตัวเอง ใช้ DB market_booking_e2e / Redis db 14
      - name: E2E test (Playwright, 360px)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # image production build ได้ และ compose ของ production ถูกต้อง (ไม่ push — deploy build บน VPS เอง)
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Compose config (production)
        run: |
          cp docker/.env.example docker/.env
          IMAGE_TAG=ci POSTGRES_PASSWORD=ci JWT_ACCESS_SECRET=ci JWT_REFRESH_SECRET=ci MINIO_SECRET_KEY=ci \
            docker compose -f docker/docker-compose.prod.yml config --quiet
          METRICS_TOKEN=ci-metrics-token-0000 ALERT_WEBHOOK_TOKEN=ci-alert-token-00000 GRAFANA_ADMIN_PASSWORD=ci \
            IMAGE_TAG=ci POSTGRES_PASSWORD=ci JWT_ACCESS_SECRET=ci JWT_REFRESH_SECRET=ci MINIO_SECRET_KEY=ci \
            docker compose -f docker/docker-compose.prod.yml --profile monitoring config --quiet

      # กฎแจ้งเตือน/คอนฟิกของ Prometheus + Alertmanager (Phase 11.4) — token จริงสร้างตอน start
      - name: Monitoring config
        run: |
          docker run --rm -v "$PWD/docker/monitoring:/etc/prometheus:ro" --entrypoint /bin/sh prom/prometheus:v3.5.0 \
            -c 'touch /tmp/metrics-token && promtool check config /etc/prometheus/prometheus.yml'
          docker run --rm -v "$PWD/docker/monitoring:/etc/alertmanager:ro" --entrypoint /bin/sh prom/alertmanager:v0.28.1 \
            -c 'touch /tmp/alert-token && amtool check-config /etc/alertmanager/alertmanager.yml'
          node -e "JSON.parse(require('fs').readFileSync('docker/monitoring/grafana/dashboards/market-booking.json','utf8'))"

      - name: Build api image
        run: docker build -f docker/api.Dockerfile --target runtime -t market-booking/api:ci .

      - name: Build nginx image (web + admin)
        run: docker build -f docker/nginx/Dockerfile -t market-booking/nginx:ci .

      - name: API image loads its modules
        run: >
          docker run --rm market-booking/api:ci node -e
          "require('@market-booking/shared'); require('./dist/generated/prisma/client')"

      - name: Nginx config is valid
        run: |
          docker run --rm -e WEB_DOMAIN=web.test -e ADMIN_DOMAIN=admin.test -e MINIO_BUCKET=market-booking \
            -e HTTPS_PORT_SUFFIX= --add-host api:127.0.0.1 --add-host minio:127.0.0.1 \
            market-booking/nginx:ci sh -c '/docker-entrypoint.sh nginx -t'
