name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market_dev
          POSTGRES_DB: market_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market -d market_booking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://market:market_dev@localhost:5432/market_booking
      TEST_DATABASE_URL: postgresql://market:market_dev@localhost:5432/market_booking_test

    steps:
      - uses: actions/checkout@v7

      # อ่านเวอร์ชันจาก "packageManager" ใน package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit test
        run: pnpm test

      # globalSetup สร้าง DB test และรัน prisma migrate deploy ให้
      - name: Integration test (PostgreSQL)
        run: pnpm test:int

      - name: Migrations in sync with schema.prisma
        run: pnpm prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Seed runs on a migrated database
        run: pnpm db:deploy && pnpm db:seed
        env:
          SEED_ADMIN_PASSWORD: ci-only-password

      - name: Build
        run: pnpm build
