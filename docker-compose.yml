# Infra สำหรับ dev เท่านั้น (production ใช้ docker/docker-compose.prod.yml — Phase 6)
name: market-booking

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market_dev
      POSTGRES_DB: market_booking
      TZ: UTC
    ports:
      # host port 5433 กันชนกับ PostgreSQL ที่ติดตั้งในเครื่อง (มักใช้ 5432)
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U market -d market_booking']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO เลิกเผยแพร่ image ทางการแล้ว ใช้ fork pgsty/minio (binary เดียวกัน) — ดู Decision Log
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-market_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-market_minio_dev}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10

  # สร้าง private bucket ครั้งแรกแล้วจบการทำงาน
  minio-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-market_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-market_minio_dev}
      MINIO_BUCKET: ${MINIO_BUCKET:-market-booking}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set none local/$$MINIO_BUCKET
      "
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  minio-data:
