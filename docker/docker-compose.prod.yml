# Production: VPS เครื่องเดียว — ขั้นตอนทั้งหมดอยู่ใน docs/runbook.md
#   cp docker/.env.example docker/.env   (แก้ค่า) แล้ว docker/scripts/deploy.sh
# เปิดออกภายนอกเฉพาะ nginx (80/443) — postgres/redis/minio/api อยู่ใน network ภายในเท่านั้น
# ชื่อไม่ซ้ำกับ docker-compose.yml ของ dev (volume แยกกัน แม้รันบนเครื่องเดียวกัน)
name: market-booking-prod

# หมุน log ของทุก container: 10 MB × 5 ไฟล์ (ดูด้วย `docker compose logs`)
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-database-url: &database-url postgresql://${POSTGRES_USER:-market}:${POSTGRES_PASSWORD:?ตั้ง POSTGRES_PASSWORD ใน docker/.env}@postgres:5432/${POSTGRES_DB:-market_booking}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ตั้ง POSTGRES_PASSWORD ใน docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:-market_booking}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # fork ของ MinIO ที่ยังเผยแพร่ image (Decision Log) — bucket private, เข้าถึงผ่าน presigned URL ทาง nginx
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?ตั้ง MINIO_ACCESS_KEY ใน docker/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?ตั้ง MINIO_SECRET_KEY ใน docker/.env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-market-booking}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set none local/$$MINIO_BUCKET
      "
    restart: 'no'
    logging: *logging

  # prisma migrate deploy ทุกครั้งที่ start (api รอจนจบ) — image เดียวกันใช้ seed/สคริปต์ admin ได้
  migrate:
    image: market-booking/api-tools:${IMAGE_TAG:?รัน docker/scripts/deploy.sh ก่อน (ตั้ง IMAGE_TAG)}
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
      target: build
    working_dir: /app/apps/api
    command: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']
    environment:
      NODE_ENV: production
      DATABASE_URL: *database-url
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *logging

  api:
    image: market-booking/api:${IMAGE_TAG:?รัน docker/scripts/deploy.sh ก่อน (ตั้ง IMAGE_TAG)}
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
      # อยู่หลัง nginx 2 ชั้น
      TRUST_PROXY: 2
      DATABASE_URL: *database-url
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      REDIS_URL: redis://redis:6379
      WORKERS_ENABLED: 'true'
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?ตั้ง JWT_ACCESS_SECRET ใน docker/.env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?ตั้ง JWT_REFRESH_SECRET ใน docker/.env}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-market-booking}
      # presigned URL ผ่าน nginx บนโดเมนเว็บ (location /<bucket>/)
      MINIO_PUBLIC_URL: https://${WEB_DOMAIN:?ตั้ง WEB_DOMAIN ใน docker/.env}${HTTPS_PORT_SUFFIX:-}
      WEB_ORIGIN: https://${WEB_DOMAIN}${HTTPS_PORT_SUFFIX:-}
      ADMIN_ORIGIN: https://${ADMIN_DOMAIN:?ตั้ง ADMIN_DOMAIN ใน docker/.env}${HTTPS_PORT_SUFFIX:-}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
      LINE_LIFF_ID: ${LINE_LIFF_ID:-}
      LINE_MESSAGING_ACCESS_TOKEN: ${LINE_MESSAGING_ACCESS_TOKEN:-}
      LINE_MESSAGING_CHANNEL_SECRET: ${LINE_MESSAGING_CHANNEL_SECRET:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_API_SECRET: ${SMS_API_SECRET:-}
      SMS_SENDER: ${SMS_SENDER:-}
      SMS_CREDIT_TYPE: ${SMS_CREDIT_TYPE:-}
      SLIP_VERIFIER: ${SLIP_VERIFIER:-manual}
      SLIPOK_BRANCH_ID: ${SLIPOK_BRANCH_ID:-}
      SLIPOK_API_KEY: ${SLIPOK_API_KEY:-}
      # Monitoring (runbook §8) — ว่าง = ปิด /api/v1/metrics และรับ alert ไม่ได้
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    logging: *logging

  nginx:
    image: market-booking/nginx:${IMAGE_TAG:?รัน docker/scripts/deploy.sh ก่อน (ตั้ง IMAGE_TAG)}
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
      args:
        VITE_LINE_LIFF_ID: ${LINE_LIFF_ID:-}
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      MINIO_BUCKET: ${MINIO_BUCKET:-market-booking}
      CERT_NAME: ${CERT_NAME:-market-booking}
      # ใช้เฉพาะทดสอบในเครื่องที่ไม่ได้เปิด 443 (เช่น ":8443") — production เว้นว่าง
      HTTPS_PORT_SUFFIX: ${HTTPS_PORT_SUFFIX:-}
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  # ต่ออายุ cert ทุก 12 ชั่วโมง (ออกครั้งแรกด้วย docker/scripts/init-ssl.sh)
  certbot:
    image: certbot/certbot:v4.0.0
    restart: unless-stopped
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      CERT_NAME: ${CERT_NAME:-market-booking}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    entrypoint:
      - /bin/sh
      - -c
      - 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    logging: *logging

  # pg_dump ทุกวัน เก็บ 14 วัน ที่ docker/backups (bind mount — copy ออกนอกเครื่องได้ตรงๆ)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ['sh', '/usr/local/bin/backup.sh']
    command: ['daemon']
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-market}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-market_booking}
      BACKUP_TIME: ${BACKUP_TIME:-20:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_PUSH_URL: ${BACKUP_PUSH_URL:-}
      TZ: UTC
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # uptime monitor (ไม่บังคับ): docker compose --profile monitoring up -d
  # เปิดเฉพาะ localhost — เข้าผ่าน SSH tunnel: ssh -L 3001:localhost:3001 <vps>
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    profiles: ['monitoring']
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - uptime-kuma-data:/app/data
    logging: *logging

  # Prometheus + Alertmanager + Grafana (Phase 11.4, ไม่บังคับ): docker compose --profile monitoring up -d
  # อยู่ใน network ภายในเท่านั้น — Grafana เปิดที่ localhost ของ VPS (SSH tunnel เหมือน Uptime Kuma)
  # ค่าที่ต้องตั้งตรวจตอน container start (ไม่ใช้ ${VAR:?} — compose ตรวจทุก service แม้ไม่ได้เปิด profile
  # ทำให้ `config`/`up` ปกติล้มเมื่อไม่ได้ใช้ monitoring)
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ['monitoring']
    restart: unless-stopped
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    # token เก็บเป็นไฟล์ (Prometheus อ่าน credentials จาก env ตรงๆ ไม่ได้)
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        [ -n "$${METRICS_TOKEN}" ] || { echo 'ตั้ง METRICS_TOKEN ใน docker/.env (runbook §8)' >&2; exit 1; } &&
        printf %s "$${METRICS_TOKEN}" > /tmp/metrics-token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ['monitoring']
    restart: unless-stopped
    environment:
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        [ -n "$${ALERT_WEBHOOK_TOKEN}" ] || { echo 'ตั้ง ALERT_WEBHOOK_TOKEN ใน docker/.env (runbook §8)' >&2; exit 1; } &&
        printf %s "$${ALERT_WEBHOOK_TOKEN}" > /tmp/alert-token &&
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml
        --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    logging: *logging

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ['monitoring']
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Bangkok
    # ไม่ตั้งรหัส = ไม่ start (ค่าเริ่มต้นของ Grafana คือ admin/admin)
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        [ -n "$${GF_SECURITY_ADMIN_PASSWORD}" ] || { echo 'ตั้ง GRAFANA_ADMIN_PASSWORD ใน docker/.env (runbook §8)' >&2; exit 1; } &&
        exec /run.sh
    ports:
      - '127.0.0.1:3002:3000'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  minio-data:
  letsencrypt:
  certbot-www:
  uptime-kuma-data:
  prometheus-data:
  grafana-data:
