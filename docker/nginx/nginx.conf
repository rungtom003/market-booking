user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
  # ช่วงเปิดจอง: socket ค้างต่อผู้ใช้ 1 ตัว + request ที่ proxy ไป api (×2 connection ต่อ client)
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time '
                  'urt=$upstream_response_time rid=$http_x_request_id';
  # stdout → docker json-file log (หมุนไฟล์ด้วย logging options ใน compose)
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  server_tokens off;
  client_max_body_size 1m;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/javascript
             image/svg+xml application/manifest+json;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  include /etc/nginx/conf.d/*.conf;
}
