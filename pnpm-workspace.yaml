packages:
  - apps/*
  - packages/*
  - e2e

# pnpm 11 ไม่รัน install script ของ dependency เว้นแต่อนุญาต
allowBuilds:
  # ต้องรัน: ดาวน์โหลด schema engine ที่ prisma migrate ใช้
  '@prisma/engines': true
  prisma: true
  # ต้องรัน: ตรวจ/ติดตั้ง binary ของ esbuild (ใช้โดย tsx)
  esbuild: true
  # ไม่ต้องรัน: มี prebuilt binary หรือเป็นแค่ข้อความ
  '@nestjs/core': false
  '@parcel/watcher': false
  unrs-resolver: false

peerDependencyRules:
  # webpack มากับ @nestjs/cli 10 (เราใช้ tsc builder ไม่ได้ใช้ webpack)
  allowedVersions:
    webpack: '5'
